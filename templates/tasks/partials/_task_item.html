{% load i18n %}
<li id="task-{{ task.id }}" class="flex items-center gap-3 rounded-md border border-border bg-surface p-3">
    <form hx-post="{% url 'tasks:toggle' pk=task.id %}" hx-target="#task-{{ task.id }}" hx-swap="outerHTML">
        {% csrf_token %}
        <button type="submit" aria-label="{% translate 'Toggle complete' %}"
                class="flex h-5 w-5 shrink-0 items-center justify-center rounded border
                    {% if task.is_completed %}border-primary-solid bg-primary-solid{% else %}border-outline bg-surface{% endif %}">
            {% if task.is_completed %}
            <svg viewBox="0 0 20 20" fill="white" class="h-3.5 w-3.5">
                <path d="M16.7 5.3a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0L4.3 10.7a1 1 0 1 1 1.4-1.4l2.8 2.8 6.8-6.8a1 1 0 0 1 1.4 0z"/>
            </svg>
            {% endif %}
        </button>
    </form>
    <div class="flex-1">
        <p class="text-sm font-medium {% if task.is_completed %}text-ink-muted line-through{% else %}text-ink{% endif %}">
            {{ task.title }}
        </p>
        {% if task.due_date %}
        <p class="text-xs text-ink-muted">{% translate "Due" %} {{ task.due_date }}</p>
        {% endif %}
    </div>
    <form hx-post="{% url 'tasks:delete' pk=task.id %}" hx-target="#task-{{ task.id }}" hx-swap="outerHTML"
          hx-confirm="{% translate 'Delete this task?' %}">
        {% csrf_token %}
        <button type="submit" aria-label="{% translate 'Delete task' %}" class="text-ink-muted hover:text-danger">
            &times;
        </button>
    </form>
</li>
