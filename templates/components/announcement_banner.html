{% load i18n %}
{% if not request.user.is_authenticated %}
<div class="flex items-center justify-center gap-3 bg-primary-solid px-4 py-2 text-center text-sm text-white sm:px-6">
    <span class="font-medium">{% translate "Try all features for free" %}</span>
    <a href="{% url 'accounts:register' %}"
       class="inline-flex shrink-0 items-center gap-1 rounded-full bg-white/15 px-3 py-1 text-xs font-semibold text-white transition hover:bg-white/25 focus-visible:focus-ring">
        {% translate "Get started" %}
        {% include "components/icons/arrow-right.html" with extra_class="h-3.5 w-3.5" only %}
    </a>
</div>
{% endif %}
