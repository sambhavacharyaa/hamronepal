<div class="rounded-2xl border border-border bg-surface p-4">
    <div class="flex items-center gap-3">
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl {{ icon_class }}">
            {% include "components/icons/"|add:icon|add:".html" with extra_class="h-5 w-5" only %}
        </span>
        <div class="min-w-0">
            <p class="text-2xl font-bold text-ink">{{ value }}</p>
            <p class="truncate text-xs text-ink-muted">{{ label }}</p>
        </div>
    </div>
</div>
